# Sync this fork with tristinbaker/IdleFantasy and build a debug APK when upstream moved.
#
# Scheduled runs attempt a merge but do NOT fail on conflicts — they write a workflow
# summary instead. Release merges still happen via Upstream Release when a new upstream
# tag ships. Fork-owned paths use merge=ours (.gitattributes).
name: Upstream Sync

on:
  schedule:
    # Daily 07:00 UTC — upstream often ships in the evening US time
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      fail_on_conflict:
        description: "Fail the job when the merge has conflicts (default: only on manual runs)"
        required: false
        type: boolean
        default: true

concurrency:
  group: upstream-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: tristinbaker/IdleFantasy

jobs:
  sync-and-build:
    name: Sync upstream, test, build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with remote main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Record HEAD before sync
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync fork with upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global merge.ours.driver true

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main --depth=500

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream main"
            exit 0
          fi

          if git merge --no-edit upstream/main; then
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "Merged upstream/main and pushed"
            exit 0
          fi

          CONFLICTS="$(git diff --name-only --diff-filter=U | tr '\n' ', ' | sed 's/, $//')"
          git merge --abort
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "conflict=true" >> "$GITHUB_OUTPUT"
          echo "conflicts=${CONFLICTS}" >> "$GITHUB_OUTPUT"
          echo "::warning::Upstream merge conflict in: ${CONFLICTS}"

          {
            echo "## Upstream sync merge conflict"
            echo
            echo "Automatic upstream sync could not merge \`${UPSTREAM_REPO}/main\` into this fork."
            echo
            echo "**Conflicting files:** ${CONFLICTS}"
            echo
            echo "Resolve manually (merge upstream, keep fork Save Viewer + CI changes), push to \`main\`, then re-run this workflow."
            echo
            echo "[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL_ON_CONFLICT="${{ github.event_name == 'workflow_dispatch' && inputs.fail_on_conflict }}"
          if [[ "$FAIL_ON_CONFLICT" == "true" ]]; then
            echo "::error::Merge conflict — resolve manually and re-run"
            exit 1
          fi

      - name: Detect new commits
        id: changes
        if: steps.sync.outputs.conflict != 'true'
        run: |
          AFTER="$(git rev-parse HEAD)"
          BEFORE="${{ steps.before.outputs.sha }}"
          if [[ "$AFTER" != "$BEFORE" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream sync brought new commits ($BEFORE -> $AFTER)"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream"
          fi

      - name: Report sync failure
        if: failure() && steps.sync.outcome == 'failure'
        run: |
          echo "::error::Upstream sync failed unexpectedly — check the workflow log."

      - name: Set up JDK 17
        if: steps.sync.outputs.conflict != 'true' && steps.changes.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.sync.outputs.conflict != 'true' && steps.changes.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        if: steps.sync.outputs.conflict != 'true' && steps.changes.outputs.changed == 'true'
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        if: steps.sync.outputs.conflict != 'true' && steps.changes.outputs.changed == 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: steps.sync.outputs.conflict != 'true' && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idle-fantasy-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Trigger upstream release workflow
        if: steps.sync.outputs.conflict != 'true' && steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Upstream moved — dispatching Upstream Release (also auto-triggered via workflow_run on success)."
          if ! gh workflow run upstream-release.yml --ref main; then
            echo "::warning::Could not dispatch upstream-release.yml; Upstream Release still runs via workflow_run or the 10-minute schedule."
            exit 1
          fi

      - name: Trigger release if fork is behind upstream tag
        if: steps.sync.outputs.conflict != 'true' && success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG="$(gh release view --repo "${UPSTREAM_REPO}" --json tagName -q .tagName)"
          if gh release view "$UPSTREAM_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$UPSTREAM_TAG" --repo "${{ github.repository }}" --json isDraft -q .isDraft)"
            ASSET_COUNT="$(gh release view "$UPSTREAM_TAG" --repo "${{ github.repository }}" --json assets -q '.assets | length')"
            if [[ "$IS_DRAFT" != "true" && "$ASSET_COUNT" -gt 0 ]]; then
              echo "Fork already has upstream release $UPSTREAM_TAG"
              exit 0
            fi
            echo "Fork release $UPSTREAM_TAG is draft or missing APK — dispatching Upstream Release"
          else
            echo "Fork missing upstream release $UPSTREAM_TAG — dispatching Upstream Release"
          fi
          gh workflow run upstream-release.yml --ref main

      - name: Trigger Save Viewer sync (optional)
        if: steps.sync.outputs.conflict != 'true' && steps.changes.outputs.changed == 'true' && vars.SAVE_VIEWER_SYNC_ENABLED == 'true'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ vars.GITEA_URL }}
          GITEA_REPO: ${{ vars.GITEA_REPO }}
        run: |
          if [[ -z "$GITEA_TOKEN" || -z "$GITEA_URL" || -z "$GITEA_REPO" ]]; then
            echo "Save Viewer trigger skipped (set vars SAVE_VIEWER_SYNC_ENABLED, GITEA_URL, GITEA_REPO and secret GITEA_TOKEN)"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            "${GITEA_URL}/api/v1/repos/${GITEA_REPO}/actions/workflows/sync-upstream.yml/dispatches" \
            -d '{"ref":"master","inputs":{"reason":"android-upstream-sync"}}'
